name: Deploy ChuiJun Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/chui-jun-server

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          IMAGE_TAG="${IMAGE_NAME}:${GITHUB_SHA}"
          echo "image_tag=${IMAGE_TAG,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}

  deploy:
    name: Deploy on staging server
    needs: build-and-push
    runs-on: [self-hosted, Linux, onprem]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy image on staging server
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          cd /opt/devops-consulting-springboot

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${IMAGE_TAG}|" .env

          cat > docker-compose.override.yml <<'EOF'
          services:
            app:
              environment:
                SERVER_PORT: "8080"
                JAVA_TOOL_OPTIONS: "-Dserver.port=8080"
          EOF

          docker compose pull app
          docker compose up -d --no-build app nginx

          sleep 30

          curl -f http://localhost:8080/actuator/health
          docker compose ps
